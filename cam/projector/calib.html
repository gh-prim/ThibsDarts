<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Projecteur · calibration</title>
<style>
:root{--beton:#121214;--asphalte:#1E1F24;--line:rgba(255,255,255,.12);--txt:#F2EEE9;--mute:#9A978F;--sunset:#FF7A2F;--fluo:#FFE14D;--crep:#FF4D8D;--ok:#7BD88F}
*{box-sizing:border-box}
body{margin:0;background:var(--beton);color:var(--txt);font:15px system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto;-webkit-user-select:none;user-select:none}
h1{font-size:20px;margin:0 0 12px}
.mute{color:var(--mute);font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:16px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{all:unset;cursor:pointer;text-align:center;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px}
button:active{background:rgba(255,122,47,.18)}
button:focus-visible{outline:2px solid var(--fluo);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--sunset);background:rgba(255,122,47,.15)}
button:disabled{opacity:.35;cursor:default}
.go{background:var(--sunset);color:#121214;font-weight:600;border-color:var(--sunset)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
section{display:none}section.on{display:block}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.03)}
.step{display:flex;gap:12px;align-items:center}
#mini{width:96px;height:96px;flex:none}
#where{font-size:17px;font-weight:600;line-height:1.3}
#pad{margin-top:10px;height:220px;border-radius:12px;border:1px dashed rgba(255,225,77,.4);background:radial-gradient(circle at center,rgba(255,225,77,.08),transparent 70%);touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;cursor:crosshair}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);cursor:pointer}
.dot.done{background:rgba(123,216,143,.18);border-color:var(--ok);color:var(--ok)}
.dot.skip{border-style:dashed}
.dot.cur{border-color:var(--fluo);color:var(--fluo)}
.row{display:flex;gap:8px;align-items:center}
.row label{flex:1;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
input[type=number]{width:100%;background:var(--asphalte);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:13px}
#msg{margin-top:10px;font-variant-numeric:tabular-nums;white-space:pre-line}
#msg.ok{color:var(--ok)}#msg.err{color:var(--crep)}
</style>
</head>
<body>
<h1>Projecteur</h1>
<div class="tabs" role="tablist">
  <button data-tab="frame">1. Cadrage</button>
  <button data-tab="points">2. Points</button>
  <button data-tab="check">3. Vérifier</button>
</div>

<section id="frame">
  <div class="lbl">Mire plein écran</div>
  <div class="card mute">Cercle rose : place de la cible par défaut. Bord rose : limite de l'image.</div>
</section>

<section id="points">
  <div class="lbl">Point <span id="num"></span></div>
  <div class="card step">
    <canvas id="mini" width="192" height="192"></canvas>
    <div><div id="where"></div><div class="mute" id="hint" style="margin-top:4px"></div></div>
  </div>
  <div id="pad">Glisser pour déplacer le pointeur</div>
  <div class="grid4" style="margin-top:6px">
    <button data-mv="-1,0" aria-label="Gauche">←</button>
    <button data-mv="0,-1" aria-label="Haut">↑</button>
    <button data-mv="0,1" aria-label="Bas">↓</button>
    <button data-mv="1,0" aria-label="Droite">→</button>
  </div>
  <div class="grid3" style="margin-top:6px">
    <button id="fine" aria-pressed="true">Précis</button>
    <button id="skip">Caché, passer</button>
    <button id="ok" class="go">Valider</button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<section id="check">
  <div class="lbl">Mire sur la cible</div>
  <div class="grid4">
    <button data-t="T20">T20</button><button data-t="D16">D16</button>
    <button data-t="DB">Bull</button><button data-t="180">180</button>
  </div>
  <div class="grid2" style="margin-top:6px">
    <button id="redo">Refaire les points</button>
    <button id="reset">Par défaut</button>
  </div>
</section>

<div class="mute" id="msg"></div>

<details>
  <summary>Position du projecteur (mm depuis le centre de la cible)</summary>
  <div class="row" style="margin-top:8px">
    <label>X <input type="number" id="prx" step="10"></label>
    <label>Y <input type="number" id="pry" step="10"></label>
    <label>Mur <input type="number" id="prz" step="10"></label>
  </div>
  <div class="mute" style="margin-top:6px">X vers la droite, Y vers le haut. Sert au masque de l'arceau et des caméras.</div>
</details>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const DOUT = 170, CAL = [[0, DOUT], [DOUT, 0], [0, -DOUT], [-DOUT, 0]];
  const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const DEF_PROJ = { x: -700, y: -530, z: 1550 };
  // Croisements du fil extérieur du double avec les fils des secteurs, puis le centre.
  // Les 4 premiers sont bien répartis : dès le 4e validé, les suivants sont pré-placés.
  const TARGETS = [0, 5, 10, 15, 2, 7, 12, 17].map(i => {
    const a = (i * 18 + 9) * Math.PI / 180;
    return { id: `${ORDER[i]}-${ORDER[(i + 1) % 20]}`, mm: [Math.sin(a) * DOUT, Math.cos(a) * DOUT],
      where: `Entre le ${ORDER[i]} et le ${ORDER[(i + 1) % 20]}`, hint: 'Fil extérieur du double, sur le fil qui sépare les deux' };
  }).concat([{ id: 'bull', mm: [0, 0], where: 'Centre du bull', hint: 'Milieu du 50' }]);
  // Mesures de rayons (après la cible) : ne servent pas à l'homographie, on en déduit le rayon réel en mm.
  const NOM = { dIn: 162, tOut: 107, tIn: 99, board: 225.5, sur: 380 };
  const RING_TXT = {
    dIn: ['Double, fil intérieur', 'Bord intérieur de la bande des doubles'],
    tOut: ['Triple, fil extérieur', 'Bord extérieur de la bande des triples'],
    tIn: ['Triple, fil intérieur', 'Bord intérieur de la bande des triples'],
    board: ['Bord de la cible', 'Limite entre la cible noire et le surround gris'],
    sur: ['Bord du surround', 'Bord extérieur du surround gris'],
  };
  const SECT = n => ORDER.indexOf(n) * 18;
  [['dIn', [20, 3]], ['tOut', [6, 11]], ['tIn', [20, 3]], ['board', [20, 6, 3, 11]], ['sur', [20, 6, 3, 11]]].forEach(([ring, nums]) => nums.forEach(n => {
    const a = SECT(n) * Math.PI / 180;
    TARGETS.push({ id: `${ring}-${n}`, ring, mm: [Math.sin(a) * NOM[ring], Math.cos(a) * NOM[ring]],
      where: `${RING_TXT[ring][0]}, face au ${n}`, hint: RING_TXT[ring][1] });
  }));
  const FIX = id => !TARGETS.find(t => t.id === id).ring;

  let W = 1280, H = 720, proj = { ...DEF_PROJ }, base = null, pairs = {}, skipped = {}, cur = 0, ptr = [W / 2, H / 2], fine = true;

  // Homographie mm -> pixels écran, aux moindres carrés sur 4 points ou plus (coordonnées normalisées).
  function fit(src, dst) {
    const sx = 1 / DOUT, mx = dst.reduce((a, p) => a + p[0], 0) / dst.length, my = dst.reduce((a, p) => a + p[1], 0) / dst.length;
    const sd = 1 / (Math.sqrt(dst.reduce((a, p) => a + (p[0] - mx) ** 2 + (p[1] - my) ** 2, 0) / dst.length) || 1);
    const M = Array.from({ length: 8 }, () => new Array(9).fill(0));
    src.forEach(([X, Y], i) => {
      const x = X * sx, y = Y * sx, u = (dst[i][0] - mx) * sd, v = (dst[i][1] - my) * sd;
      [[x, y, 1, 0, 0, 0, -u * x, -u * y, u], [0, 0, 0, x, y, 1, -v * x, -v * y, v]].forEach(r => {
        for (let a = 0; a < 8; a++) for (let b = 0; b < 9; b++) M[a][b] += r[a] * r[b];
      });
    });
    for (let c = 0; c < 8; c++) {
      let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = 0; r < 8; r++) { if (r === c) continue; const f = M[r][c] / M[c][c]; for (let k = c; k < 9; k++) M[r][k] -= f * M[c][k]; }
    }
    const h = M.map((r, i) => r[8] / r[i]);
    return (X, Y) => { const x = X * sx, y = Y * sx, w = h[6] * x + h[7] * y + 1; return [((h[0] * x + h[1] * y + h[2]) / w) / sd + mx, ((h[3] * x + h[4] * y + h[5]) / w) / sd + my]; };
  }
  const defPts = () => { const s = 514 / 451; return CAL.map(([x, y]) => [W / 2 + x * s, H / 2 - y * s]); };
  function model() {
    const ids = Object.keys(pairs).filter(FIX);
    if (ids.length >= 4) return fit(ids.map(i => pairs[i].mm), ids.map(i => pairs[i].px));
    return fit(CAL, base || defPts());
  }

  // Rayons réels (mm) mesurés : homographie inverse, moyenne par anneau.
  function rings() {
    const ids = Object.keys(pairs).filter(FIX);
    if (ids.length < 4) return {};
    const inv = fit(ids.map(i => pairs[i].px.map(v => v / 4)), ids.map(i => pairs[i].mm));
    const acc = {};
    Object.keys(pairs).filter(i => !FIX(i)).forEach(i => {
      const t = TARGETS.find(x => x.id === i), [x, y] = inv(...pairs[i].px.map(v => v / 4));
      (acc[t.ring] = acc[t.ring] || []).push(Math.hypot(x, y));
    });
    const out = {};
    Object.entries(acc).forEach(([k, v]) => { out[k] = Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10; });
    return out;
  }

  // Réseau.
  const post = (url, b) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
  function msg(t, cls) { $('msg').textContent = t; $('msg').className = cls || 'mute'; }
  let ptrTimer = null, ptrLast = 0;
  function sendPointer() {
    const now = performance.now(); clearTimeout(ptrTimer);
    if (tab !== 'points') return;
    if (now - ptrLast < 30) { ptrTimer = setTimeout(sendPointer, 30); return; }
    ptrLast = now;
    post('/pointer', { x: ptr[0], y: ptr[1], done: Object.entries(pairs).filter(([id]) => id !== TARGETS[cur].id).map(([, p]) => p.px) }).catch(() => msg('Pi 5 injoignable', 'err'));
  }
  function saveCalib(pattern) {
    const m = model(), points = CAL.map(([x, y]) => m(x, y));
    const list = Object.entries(pairs).map(([id, p]) => ({ id, mm: p.mm, px: p.px }));
    return post('/calib.json', { points, pattern, projector: proj, pairs: list, rings: rings(), save: true })
      .then(r => { if (!r.ok) throw 0; base = points; })
      .catch(() => msg('Pi 5 injoignable', 'err'));
  }

  // Onglets : chacun pilote ce que montre le projecteur.
  let tab = 'frame';
  function show(t) {
    tab = t;
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
    document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === t));
    msg('');
    if (t === 'frame') post('/pointer', { grid: true });
    if (t === 'points') goTo(cur);
    if (t === 'check') { post('/pointer', { off: true }); saveCalib(true).then(() => msg(errText(), 'ok')); }
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => show(b.dataset.tab));

  // Étape par point.
  function goTo(i) {
    cur = Math.max(0, Math.min(TARGETS.length - 1, i));
    const t = TARGETS[cur];
    ptr = pairs[t.id] ? pairs[t.id].px.slice() : model()(...t.mm);
    $('num').textContent = `${cur + 1} / ${TARGETS.length}`;
    $('where').textContent = t.where; $('hint').textContent = t.hint;
    drawMini(); dots(); sendPointer();
  }
  function dots() {
    $('dots').innerHTML = '';
    TARGETS.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (pairs[t.id] ? ' done' : '') + (skipped[t.id] ? ' skip' : '') + (i === cur ? ' cur' : '');
      d.textContent = i + 1; d.title = t.where; d.onclick = () => goTo(i);
      $('dots').appendChild(d);
    });
  }
  function errText() {
    const ids = Object.keys(pairs).filter(FIX), r = rings();
    const rt = Object.entries(r).map(([k, v]) => `${RING_TXT[k][0]} ${String(v).replace('.', ',')} mm`).join(' · ');
    if (ids.length < 5) return `${ids.length} points relevés` + (rt ? ' · ' + rt : '');
    const m = model(), e = ids.map(i => { const [x, y] = m(...pairs[i].mm); return Math.hypot(x - pairs[i].px[0], y - pairs[i].px[1]); });
    return `${ids.length} points · écart moyen ${(e.reduce((a, b) => a + b, 0) / e.length).toFixed(1).replace('.', ',')} px · max ${Math.max(...e).toFixed(1).replace('.', ',')} px` + (rt ? '\n' + rt : '');
  }
  $('ok').onclick = () => {
    const t = TARGETS[cur];
    if (t.ring && Object.keys(pairs).filter(FIX).length < 4) { msg('4 points de la cible avant les anneaux', 'err'); return; }
    pairs[t.id] = { mm: t.mm, px: ptr.slice() }; delete skipped[t.id];
    next();
  };
  $('skip').onclick = () => { const t = TARGETS[cur]; delete pairs[t.id]; skipped[t.id] = 1; next(); };
  function next() {
    const n = Object.keys(pairs).filter(FIX).length;
    if (n >= 4) saveCalib(false);
    const todo = TARGETS.findIndex((t, i) => i > cur && !pairs[t.id] && !skipped[t.id]);
    if (todo >= 0) { goTo(todo); msg(errText()); return; }
    if (n >= 4) show('check'); else { msg('4 points minimum', 'err'); goTo(TARGETS.findIndex(t => !pairs[t.id])); }
  }

  // Mini cible : le point à viser.
  function drawMini() {
    const t0 = TARGETS[cur], R = Math.max(DOUT, Math.hypot(...t0.mm)), g = $('mini').getContext('2d'), S = 192, c = S / 2, k = (S / 2 - 8) / R;
    g.clearRect(0, 0, S, S);
    g.fillStyle = '#1E1F24'; g.beginPath(); g.arc(c, c, DOUT * k, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(242,238,233,.35)'; g.lineWidth = 1.5;
    if (R > DOUT) { g.strokeStyle = 'rgba(154,151,143,.5)'; [225.5, 380].filter(r => r <= R + 1).forEach(r => { g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.stroke(); }); g.strokeStyle = 'rgba(242,238,233,.35)'; }
    [6.35, 15.9, 99, 107, 162, 170].forEach(r => { g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.stroke(); });
    for (let i = 0; i < 20; i++) { const a = (i * 18 + 9) * Math.PI / 180; g.beginPath(); g.moveTo(c + Math.sin(a) * 15.9 * k, c - Math.cos(a) * 15.9 * k); g.lineTo(c + Math.sin(a) * DOUT * k, c - Math.cos(a) * DOUT * k); g.stroke(); }
    g.fillStyle = 'rgba(242,238,233,.6)'; g.font = '600 14px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (R <= DOUT) g.fillText('20', c, c - 135 * k);
    TARGETS.forEach(t => { if (pairs[t.id]) { g.fillStyle = '#7BD88F'; g.beginPath(); g.arc(c + t.mm[0] * k, c - t.mm[1] * k, 4, 0, Math.PI * 2); g.fill(); } });
    const t = TARGETS[cur], x = c + t.mm[0] * k, y = c - t.mm[1] * k;
    g.strokeStyle = '#FFE14D'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#FFE14D'; g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill();
  }

  // Pavé tactile : déplacement relatif du pointeur (Précis : 1 px d'écran pour 4 px de doigt).
  const pad = $('pad'); let last = null;
  pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); last = [e.clientX, e.clientY]; });
  pad.addEventListener('pointermove', e => {
    if (!last) return;
    const g = fine ? .25 : 1.5;
    ptr = [Math.max(0, Math.min(W, ptr[0] + (e.clientX - last[0]) * g)), Math.max(0, Math.min(H, ptr[1] + (e.clientY - last[1]) * g))];
    last = [e.clientX, e.clientY]; sendPointer();
  });
  ['pointerup', 'pointercancel'].forEach(ev => pad.addEventListener(ev, () => { last = null; }));
  function repeat(btn, fn) {
    let t = null;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); t = setTimeout(function go() { fn(); t = setTimeout(go, 50); }, 350); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearTimeout(t)));
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  }
  document.querySelectorAll('[data-mv]').forEach(b => { const [x, y] = b.dataset.mv.split(',').map(Number); repeat(b, () => { ptr = [ptr[0] + x, ptr[1] + y]; sendPointer(); }); });
  addEventListener('keydown', e => {
    if (tab !== 'points' || e.target.tagName === 'INPUT') return;
    const s = e.shiftKey ? 10 : 1, mv = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
    if (mv) { e.preventDefault(); ptr = [ptr[0] + mv[0], ptr[1] + mv[1]]; sendPointer(); }
    if (e.key === 'Enter') { e.preventDefault(); $('ok').click(); }
  });
  $('fine').onclick = () => { fine = !fine; $('fine').setAttribute('aria-pressed', String(fine)); };

  // Vérifier.
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    saveCalib(false).then(() => post('/test', { kind: b.dataset.t }));
  });
  $('redo').onclick = () => { pairs = {}; skipped = {}; cur = 0; show('points'); };
  $('reset').onclick = () => { pairs = {}; skipped = {}; base = defPts(); proj = { ...DEF_PROJ }; showProj(); saveCalib(true).then(() => msg('Valeurs par défaut', 'ok')); };
  function showProj() { $('prx').value = proj.x; $('pry').value = proj.y; $('prz').value = proj.z; }
  ['prx', 'pry', 'prz'].forEach((id, i) => $(id).onchange = () => { const v = Number($(id).value); if (isFinite(v)) { proj['xyz'[i]] = v; saveCalib(tab === 'check'); } });

  // En quittant la page, le projecteur revient à l'image normale.
  addEventListener('pagehide', () => navigator.sendBeacon && navigator.sendBeacon('/pointer', new Blob([JSON.stringify({ off: true })], { type: 'application/json' })));

  fetch('/calib.json').then(r => r.json()).then(d => {
    if (d && Array.isArray(d.screen)) [W, H] = d.screen;
    if (d && d.points) base = d.points;
    if (d && d.projector) proj = d.projector;
    if (d && Array.isArray(d.pairs)) d.pairs.forEach(p => { if (TARGETS.some(t => t.id === p.id)) pairs[p.id] = { mm: p.mm, px: p.px }; });
  }).catch(() => msg('Pi 5 injoignable', 'err')).finally(() => {
    showProj();
    const first = TARGETS.findIndex(t => !pairs[t.id]);
    cur = first < 0 ? 0 : first;
    show(Object.keys(pairs).length >= 4 ? 'check' : 'frame');
  });
})();
</script>
</body>
</html>
