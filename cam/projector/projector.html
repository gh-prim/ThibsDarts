<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>ThibsDarts projecteur</title>
<style>
@font-face{font-family:"Permanent Marker";src:local("Permanent Marker"),url(/fonts/PermanentMarker.woff2) format("woff2")}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#c{position:absolute;left:0;top:0;transform-origin:0 0}
#ptr{position:absolute;left:0;top:0;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ptr"></canvas>
<script src="/fx.js"></script>
<script>
// Image du vidéoprojecteur : le canevas FX (en mm de cible) est posé sur l'écran par une homographie
// calculée à partir de 4 points réglés depuis /calib. Les événements arrivent du serveur en SSE.
(() => {
  const cv = document.getElementById('c');
  FX.init(cv, '/heads/');
  if (document.fonts && document.fonts.load) document.fonts.load('40px "Permanent Marker"').catch(() => {});
  let mode = 'show', H = null, projOn = true;

  // Homographie qui envoie 4 points src sur 4 points dst (système 8 x 8).
  function homography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    for (let c = 0; c < 8; c++) {
      let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      for (let r = 0; r < 8; r++) { if (r === c) continue; const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; }
    }
    return b.map((v, i) => v / A[i][i]);
  }
  // Points d'écran par défaut : cible au centre, 514 px de diamètre (projecteur sur la baie).
  function defaultPoints() {
    const s = 514 / 451, cx = innerWidth / 2, cy = innerHeight / 2;
    return FX.CAL_MM.map(([x, y]) => [cx + x * s, cy - y * s]);
  }
  function apply(points) {
    const src = FX.CAL_MM.map(([x, y]) => [FX.CX + x * FX.K, FX.CY - y * FX.K]);
    const h = homography(src, points);
    cv.style.transform = `matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;
    H = h;
  }
  apply(defaultPoints());
  // Taille de l'image projetée, pour que /calib dessine le bon cadre.
  const sendScreen = () => fetch('/screen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ w: innerWidth, h: innerHeight }) }).catch(() => {});
  sendScreen(); addEventListener('resize', sendScreen);

  // Pause des caméras pendant les animations : on prévient avant, et tant que ça bouge.
  let lightUntil = 0;
  function light(force) {
    if (!projOn) return;
    const left = FX.busyFor();
    const until = performance.now() + left * 1000;
    if (left <= 0 && !force) return;
    if (!force && until < lightUntil - 200) return;
    lightUntil = until;
    fetch('/light', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ms: Math.round(left * 1000) + 300 }) }).catch(() => {});
  }

  // Calibration guidée : un pointeur en pixels d'écran (sans homographie), seul sur fond noir.
  const pc = document.getElementById('ptr'), pg = pc.getContext('2d');
  function pointer(d) {
    const on = d && !d.off && (d.grid || typeof d.x === 'number');
    pc.style.display = on ? 'block' : 'none'; cv.style.visibility = on ? 'hidden' : 'visible';
    if (!on) return;
    const W = pc.width = innerWidth, H = pc.height = innerHeight;
    pg.clearRect(0, 0, W, H);
    if (d.grid) {
      // Mire plein écran : bord, quadrillage de 40 px, axes, diagonales, cercle centré.
      pg.lineWidth = 1;
      for (let x = W / 2 % 40; x < W; x += 40) { pg.strokeStyle = Math.abs(x - W / 2) < 1 ? '#FFE14D' : 'rgba(255,255,255,.22)'; pg.beginPath(); pg.moveTo(Math.round(x) + .5, 0); pg.lineTo(Math.round(x) + .5, H); pg.stroke(); }
      for (let y = H / 2 % 40; y < H; y += 40) { pg.strokeStyle = Math.abs(y - H / 2) < 1 ? '#FFE14D' : 'rgba(255,255,255,.22)'; pg.beginPath(); pg.moveTo(0, Math.round(y) + .5); pg.lineTo(W, Math.round(y) + .5); pg.stroke(); }
      pg.strokeStyle = 'rgba(255,122,47,.6)'; pg.beginPath(); pg.moveTo(0, 0); pg.lineTo(W, H); pg.moveTo(W, 0); pg.lineTo(0, H); pg.stroke();
      pg.strokeStyle = '#FF4D8D'; pg.lineWidth = 4; pg.strokeRect(2, 2, W - 4, H - 4);
      pg.lineWidth = 2; pg.beginPath(); pg.arc(W / 2, H / 2, Math.min(W, H) * .27, 0, Math.PI * 2); pg.stroke();
      pg.fillStyle = '#FFE14D'; pg.font = '600 16px system-ui'; pg.textAlign = 'left'; pg.textBaseline = 'top';
      pg.fillText(`${W} x ${H}`, 12, 12);
      return;
    }
    (d.done || []).forEach(([x, y]) => { pg.fillStyle = '#FF4D8D'; pg.beginPath(); pg.arc(x, y, 3, 0, Math.PI * 2); pg.fill(); });
    // Croix simple : deux traits continus de 2 px, cyan, qui se coupent sur le point visé.
    const x = Math.round(d.x), y = Math.round(d.y), len = 110;
    pg.fillStyle = '#00F0FF';
    pg.fillRect(x - len, y - 1, len * 2, 2);
    pg.fillRect(x - 1, y - len, 2, len * 2);
  }

  const es = new EventSource('/events');
  es.addEventListener('pointer', e => pointer(JSON.parse(e.data)));
  es.addEventListener('calib', e => { const d = JSON.parse(e.data); if (d.points) apply(d.points); mode = d.pattern ? 'pattern' : 'show'; if (d.projector) FX.setProjector(d.projector); FX.setRings(d.rings); });
  // Mode Debug, projecteur éteint : image noire (sauf le pointeur de calibration), aucune animation.
  es.addEventListener('debug', e => { const d = JSON.parse(e.data); projOn = d.projector !== false; cv.style.opacity = projOn ? '1' : '0'; });
  es.addEventListener('state', e => { FX.setPlaying(JSON.parse(e.data).playing); });
  es.addEventListener('dart', e => {
    const d = JSON.parse(e.data), m = d.multiplier | 0, n = d.number | 0;
    // MQTT : y vers le bas. Ici : y vers le haut. Sans position, on prend le centre du segment.
    let x = d.x, y = d.y;
    if (typeof x !== 'number' || typeof y !== 'number') {
      const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
      const a = ORDER.indexOf(n) * 18 * Math.PI / 180, r = n === 25 ? 0 : m === 3 ? 103 : m === 2 ? 166 : 135;
      x = Math.sin(a) * r; y = Math.cos(a) * r;
    } else y = -y;
    FX.dart({ n, m, x, y });
    light(true);
  });
  es.addEventListener('test', e => { const d = JSON.parse(e.data); if (d.kind === '180') { FX.big180(); light(true); } });

  let last = performance.now(), lastPing = 0;
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    FX.frame(dt, now, mode);
    // Une animation peut en lancer d'autres (feux d'artifice) : on prolonge la pause si besoin.
    if (now - lastPing > 500) { lastPing = now; if (FX.busyFor() > 0) light(false); }
    requestAnimationFrame(loop);
  })(performance.now());
  window.__proj = { apply, homography };
})();
</script>
</body>
</html>
