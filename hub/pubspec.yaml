name: dartos_hub
description: Écran joueur Dart OS (Raspberry Pi 4 + écran 7 pouces).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  darts_engine:
    path: ../packages/darts_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/PermanentMarker.ttf
