name: ThibsDarts
options:
  bundleIdPrefix: com.thibsdarts
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ThibsDarts:
    type: application
    platform: iOS
    sources:
      - ThibsDarts
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibsdarts.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ThibsDarts/Info.plist
      properties:
        CFBundleDisplayName: ThibsDarts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - lucide.ttf
          - PermanentMarker.ttf
        NSCameraUsageDescription: "Pour scanner le QR code du Pi et prendre ta photo de profil."
        NSLocalNetworkUsageDescription: "Pour parler à ton ThibsDarts sur le Wi-Fi de la maison."
        NSBonjourServices:
          - _thibsdarts._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.thibsdarts.setup
            CFBundleURLSchemes:
              - thibsdarts
  ThibsDartsTV:
    type: application
    platform: tvOS
    sources:
      - TV
      - Shared
      - path: ThibsDarts/Theme
      - path: ThibsDarts/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibsdarts.tv
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: ThibsDarts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - lucide.ttf
          - PermanentMarker.ttf
        NSLocalNetworkUsageDescription: "Pour trouver ta cible ThibsDarts sur le Wi-Fi."
        NSBonjourServices:
          - _thibsdarts._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
